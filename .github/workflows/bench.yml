# x86-64 speed and parity on GitHub's Linux runners (the deployment target is a Linux x86-64 CPU
# container). Builds the release binaries, makes PyTorch references on a synthetic clip (no
# copyrighted audio), checks segment and full-path parity, times one segment forward at 1/2/4
# threads, and times PyTorch CPU (torch 2.2.2, demucs 4.0.1) on the same runner as the baseline.
name: bench

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "machine: ubuntu-latest (GitHub, 4 vCPU) or a Blacksmith size, e.g. blacksmith-8vcpu-ubuntu-2404 (counts 4x against the 3000 free 2-vCPU minutes a month)"
        default: ubuntu-latest
      models:
        description: models to bench
        default: htdemucs
      threads:
        description: thread counts
        default: "1 2"
      variants:
        description: "space-separated label:ENV=V,ENV2=V settings, each benched (interleaved over rounds)"
        default: "base:"
      rounds:
        description: rounds over the variants (the summary gives the median)
        default: "1"
      torch:
        description: also time PyTorch (the baseline)
        type: boolean
        default: true
      parity:
        description: make PyTorch references and check parity
        type: boolean
        default: true
      features:
        description: extra cargo features for the bench build
        default: ""
      milestones:
        description: "commits to time with .github/bench/cputime.rs on this runner (same machine, comparable)"
        default: ""
      features_b:
        description: "features for a second bench build (variants with BIN=b use it; none = --no-default-features)"
        default: ""
  push:
    branches: [main]
    paths:
      - .github/workflows/bench.yml
      - .github/bench/**
      - src/bin/bench.rs

concurrency:
  # pushes cancel each other; manual runs each get their own group
  group: ${{ github.event_name == 'push' && format('bench-push-{0}', github.ref) || format('bench-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  MODELS: ${{ inputs.models || 'htdemucs' }}
  THREADS: ${{ inputs.threads || '1 2' }}
  VARIANTS: ${{ inputs.variants || 'base:' }}
  ROUNDS: ${{ inputs.rounds || '1' }}
  FEATURES: ${{ inputs.features || '' }}
  FEATURES_B: ${{ inputs.features_b || '' }}
  MILESTONES: ${{ inputs.milestones || '' }}
  RUN_TORCH: ${{ github.event_name == 'push' || inputs.torch }}
  RUN_PARITY: ${{ github.event_name == 'push' || inputs.parity }}

jobs:
  bench:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CPU
        run: |
          lscpu
          echo "nproc $(nproc)"; free -g
          echo "x86 SIMD flags: $(grep -o -w -E 'avx2|fma|avx512f|avx512bw|avx512vl|avx512_bf16|avx512_vnni|amx_tile' /proc/cpuinfo | sort -u | tr '\n' ' ')"
          {
            echo "### Runner"
            echo '```'
            lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Core|Socket|L2|L3'
            echo "flags: $(grep -o -w -E 'avx2|fma|avx512f|avx512bw|avx512vl|avx512_bf16|avx512_vnni|amx_tile' /proc/cpuinfo | sort -u | tr '\n' ' ')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/bench/requirements.txt

      - name: Python deps (torch 2.2.2 CPU, demucs 4.0.1)
        if: env.RUN_TORCH == 'true' || env.RUN_PARITY == 'true'
        run: pip install -q -r .github/bench/requirements.txt

      - name: Weights cache
        id: weights
        uses: actions/cache@v4
        with:
          path: |
            weights
            ~/.cache/torch/hub/checkpoints
          key: weights-${{ hashFiles('tools/convert.py', 'tools/st.py') }}-v1

      - name: Convert weights (demucs' own checkpoint download)
        if: steps.weights.outputs.cache-hit != 'true'
        run: |
          pip install -q -r .github/bench/requirements.txt
          python tools/convert.py htdemucs htdemucs_6s

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: OpenBLAS
        if: contains(env.FEATURES, 'openblas')
        run: sudo apt-get install -y -q libopenblas-dev && dpkg -l | grep -i openblas

      - name: Build
        run: |
          cargo build --release --bins ${FEATURES:+--features $FEATURES}
          ls -l target/release/htdemucs-rs target/release/bench
          if [ -n "$FEATURES_B" ]; then
            if [ "$FEATURES_B" = none ]; then fb=--no-default-features; else fb="--features $FEATURES_B"; fi
            cargo build --release --bin bench $fb --target-dir target-b
            ls -l target-b/release/bench
          fi

      - name: Tests
        run: cargo test --release -q ${FEATURES:+--features $FEATURES}

      - name: References (PyTorch, synthetic clip)
        if: env.RUN_PARITY == 'true'
        run: |
          mkdir -p ref/ci
          python .github/bench/synth.py ref/ci/synth.wav 12
          for m in $MODELS; do
            python tools/harness.py --wav ref/ci/synth.wav --model $m --chunk 1 --out ref/ci/seg-$m.safetensors
            python tools/ref_separate.py --model $m --shifts 2 --seed 0 ref/ci/synth.wav ref/ci/synth.$m.s2.safetensors
          done

      - name: Parity
        if: env.RUN_PARITY == 'true'
        run: |
          echo "### Parity (synthetic 12 s clip)" >> "$GITHUB_STEP_SUMMARY"
          for m in $MODELS; do
            ./target/release/parity weights ref/ci/seg-$m.safetensors | tee parity-$m.txt | grep -E '^## |final output|^\| (output|ispec|crosstransformer) '
            echo "- segment $m: $(grep 'final output' parity-$m.txt)" >> "$GITHUB_STEP_SUMMARY"
            rm ref/ci/seg-$m.safetensors
            for tune in 0 1; do
              HTDEMUCS_MALLOC_TUNE=$tune /usr/bin/time -f "separate $m (malloc tune $tune): %e s wall, %U+%S s CPU, peak RSS %M KB, %R minor faults" \
                ./target/release/htdemucs-rs separate -q -n $m --shifts 2 --seed 0 --float32 --clip-mode none -o sep ref/ci/synth.wav
            done
            ./target/release/compare ref/ci/synth.$m.s2.safetensors sep/$m/synth | tee -a compare.txt
            echo "- full path $m shifts 2: $(tail -1 compare.txt)" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Bench (Rust)
        run: |
          first=1
          for r in $(seq 1 $ROUNDS); do
            for m in $MODELS; do
              for v in $VARIANTS; do
                label=${v%%:*}; envs=$(echo "${v#*:}" | tr ',' ' ')
                bin=./target/release/bench
                case " $envs " in *" BIN=b "*) bin=./target-b/release/bench; envs=$(echo "$envs" | sed 's/BIN=b//') ;; esac
                for t in $THREADS; do
                  if [ $first = 1 ]; then check=1,2,4,8; else check=; fi
                  if [ $r = 1 ] && [ $t = 1 ]; then prof=1; else prof=; fi
                  echo "== round $r model $m variant $label ($envs) threads $t"
                  env $envs RAYON_NUM_THREADS=$t OPENBLAS_NUM_THREADS=$t HTDEMUCS_CHECK_THREADS=$check ${prof:+HTDEMUCS_PROFILE=1} $bin weights $m 3 \
                    | sed "s/^RESULT /RESULT variant=$label round=$r /" | tee -a bench.txt
                  first=0
                done
              done
            done
          done
          {
            echo "### Rust ${FEATURES:+($FEATURES) }one segment: CPU s per forward (each round), best wall s"
            echo '```'
            grep '^RESULT' bench.txt | sed -E 's/.*variant=([^ ]*) round=[^ ]* model=([^ ]*) threads=([^ ]*) .*wall_best=([^ ]*) .*cpu=([^ ]*) .*/\2 \1 t\3 \5 \4/' \
              | sort | awk '{k=$1" "$2" "$3; c[k]=c[k]" "$4; w[k]=w[k]" "$5} END {for (k in c) print k, "cpu", c[k], "| wall_best", w[k]}' | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Milestones (each commit's segment forward on this runner)
        if: env.MILESTONES != ''
        run: |
          for c in $MILESTONES; do
            git worktree add -f ../m-$c $c
            cp .github/bench/cputime.rs ../m-$c/src/bin/cputime.rs
            (cd ../m-$c && cargo build --release -q --bin cputime --target-dir "$GITHUB_WORKSPACE/target-m")
            cp target-m/release/cputime cputime-$c
          done
          for r in $(seq 1 $ROUNDS); do
            for m in $MODELS; do
              for t in $THREADS; do
                for c in $MILESTONES; do
                  RAYON_NUM_THREADS=$t ./cputime-$c weights $m 3 | sed "s/^CPUTIME /CPUTIME commit=$c round=$r /" | tee -a milestones.txt
                done
              done
            done
          done
          {
            echo "### Milestones: CPU s per segment forward (each round)"
            echo '```'
            sed -E 's/.*commit=([^ ]*) round=[^ ]* model=([^ ]*) threads=([^ ]*) cpu=([^ ]*) .*/\2 t\3 \1 \4/' milestones.txt \
              | awk '{k=$1" "$2" "$3; c[k]=c[k]" "$4} END {for (k in c) print k, c[k]}' | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bench (PyTorch)
        if: env.RUN_TORCH == 'true'
        run: |
          echo "### PyTorch, one segment" >> "$GITHUB_STEP_SUMMARY"
          for m in $MODELS; do
            for t in $THREADS; do
              python .github/bench/torch_bench.py $m $t 2 | tee -a torch.txt
            done
          done
          grep '^RESULT' torch.txt | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-logs
          path: |
            bench.txt
            torch.txt
            parity-*.txt
            compare.txt
            milestones.txt
          if-no-files-found: ignore

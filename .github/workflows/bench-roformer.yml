# Mel-RoFormer (src/roformer.rs) on GitHub's Linux x86-64 runners: PyTorch references on a
# synthetic clip made on the runner (no copyrighted audio), one-chunk and full-path parity, thread
# determinism, and CPU time of one chunk forward for this crate and for PyTorch 2.2.2 CPU.
name: bench-roformer

on:
  workflow_dispatch:
    inputs:
      threads:
        description: thread counts
        default: "1 2"
      runs:
        description: timed forwards per thread count
        default: "2"
      variants:
        description: "space-separated label:ENV=V,ENV2=V settings for the Rust bench"
        default: "base:"
      torch:
        description: also time PyTorch (the baseline)
        type: boolean
        default: true
      parity:
        description: make PyTorch references and check parity
        type: boolean
        default: true
  # A push that changes .github/bench/mr_run.env runs with the settings in that file (for branches,
  # where workflow_dispatch is not available until the workflow is on the default branch).
  push:
    branches: [melroformer]
    paths:
      - .github/workflows/bench-roformer.yml
      - .github/bench/mr_run.env

concurrency:
  group: bench-roformer-${{ github.run_id }}

env:
  CARGO_TERM_COLOR: never
  KIM: kim
  CKPT: ckpt/MelBandRoformer.ckpt

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Settings (inputs, or .github/bench/mr_run.env for push runs)
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            grep -E '^(THREADS|RUNS|VARIANTS|RUN_TORCH|RUN_PARITY)=' .github/bench/mr_run.env >> "$GITHUB_ENV"
          else
            {
              echo "THREADS=${{ inputs.threads }}"; echo "RUNS=${{ inputs.runs }}"; echo "VARIANTS=${{ inputs.variants }}"
              echo "RUN_TORCH=${{ inputs.torch }}"; echo "RUN_PARITY=${{ inputs.parity }}"
            } >> "$GITHUB_ENV"
          fi

      - name: CPU
        run: |
          lscpu; echo "nproc $(nproc)"; free -g
          {
            echo "### Runner"
            echo '```'
            lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Core|Socket|L2|L3'
            echo "flags: $(grep -o -w -E 'avx2|fma|avx512f|avx512bw|avx512vl|avx512_bf16|avx512_vnni|amx_tile' /proc/cpuinfo | sort -u | tr '\n' ' ')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkpoint + converted weights cache
        id: ckpt
        uses: actions/cache@v4
        with:
          path: |
            ckpt
            weights
          key: melroformer-87201f4d-${{ hashFiles('tools/melroformer.py', 'tools/st.py') }}

      - name: Need Python?
        run: |
          if [ "$RUN_TORCH" = true ] || [ "$RUN_PARITY" = true ] || [ "${{ steps.ckpt.outputs.cache-hit }}" != true ]; then
            echo NEED_PY=true >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: env.NEED_PY == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/bench/mr_requirements.txt

      - name: Python deps (torch 2.2.2 CPU + upstream's)
        if: env.NEED_PY == 'true'
        run: pip install -q -r .github/bench/mr_requirements.txt

      - name: Upstream inference code (KimberleyJensen/Mel-Band-Roformer-Vocal-Model @25f44ff)
        if: env.NEED_PY == 'true'
        run: |
          git clone -q https://github.com/KimberleyJensen/Mel-Band-Roformer-Vocal-Model $KIM
          git -C $KIM checkout -q 25f44ff

      - name: Download checkpoint (huggingface.co/KimberleyJSN/melbandroformer, MIT)
        if: steps.ckpt.outputs.cache-hit != 'true'
        run: |
          mkdir -p ckpt
          [ -f $CKPT ] || curl -sSfL -o $CKPT https://huggingface.co/KimberleyJSN/melbandroformer/resolve/main/MelBandRoformer.ckpt
          echo "87201f4d31afb5bc79993230fc49446918425574db48c01c405e44f365c7559e  $CKPT" | sha256sum -c

      - name: Convert weights
        if: steps.ckpt.outputs.cache-hit != 'true'
        run: python tools/melroformer.py convert $KIM $CKPT && ls -l weights

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --bins && ls -l target/release/htdemucs-rs target/release/mr_bench

      - name: Tests
        run: cargo test --release -q

      - name: Parity (synthetic 12 s clip; references made here)
        if: env.RUN_PARITY == 'true'
        run: |
          mkdir -p ref/ci
          python .github/bench/synth.py ref/ci/synth0.wav 12
          # + a -60 dBFS white-noise floor: the synthetic mix leaves whole mel bands at FFT-rounding
          # level, which the band split's RMSNorm scales to unit vectors - there PyTorch float32
          # itself is 11 dB (band split) / 23 dB (output) from PyTorch float64, so no float32
          # implementation can match it (see README).
          python -c "import soundfile as sf, numpy as np; x, r = sf.read('ref/ci/synth0.wav', dtype='float32'); x += (np.random.default_rng(7).standard_normal(x.shape) * 1e-3).astype('float32'); sf.write('ref/ci/synth.wav', x, r, subtype='FLOAT')"
          python tools/melroformer.py segment $KIM $CKPT ref/ci/synth.wav ref/ci/seg.safetensors --chunk 1 --threads 2
          ./target/release/mr_parity weights ref/ci/seg.safetensors | tee mr-parity.txt
          rm ref/ci/seg.safetensors
          python tools/melroformer.py separate $KIM $CKPT ref/ci/synth.wav ref/ci/synth.mr.safetensors --threads 2 | tee torch-separate.txt
          /usr/bin/time -f "separate melroformer: %e s wall, %U+%S s CPU, peak RSS %M KB" \
            ./target/release/htdemucs-rs separate -q -n melroformer --float32 --clip-mode none -o sep ref/ci/synth.wav 2>&1 | tee rust-separate.txt
          ./target/release/compare ref/ci/synth.mr.safetensors sep/melroformer/synth | tee compare.txt
          {
            echo "### Parity (synthetic 12 s clip)"
            echo "- chunk: $(grep 'final output' mr-parity.txt)"
            echo "- full path: $(tail -1 compare.txt)"
            echo "- PyTorch full path: $(tail -1 torch-separate.txt)"
            echo "- Rust full path: $(tail -1 rust-separate.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Kernel micro-benchmarks (ns per element)
        run: cargo run --release -q --example mr_micro | tee micro.txt

      - name: Bench (Rust)
        run: |
          first=1
          for v in $VARIANTS; do
            label=${v%%:*}; envs=$(echo "${v#*:}" | tr ',' ' ')
            for t in $THREADS; do
              if [ $first = 1 ]; then check=1,2,4; else check=; fi
              if [ $t = 1 ]; then prof=1; else prof=; fi
              echo "== variant $label ($envs) threads $t"
              env $envs RAYON_NUM_THREADS=$t MR_CHECK_THREADS=$check ${prof:+MR_PROFILE=1} ./target/release/mr_bench weights $RUNS \
                | sed "s/^RESULT /RESULT variant=$label /" | tee -a bench.txt
              first=0
            done
          done
          { echo "### Rust, one chunk (8 s)"; echo '```'; grep -E '^RESULT|bit-identical' bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Bench (PyTorch)
        if: env.RUN_TORCH == 'true'
        run: |
          for t in $THREADS; do
            python tools/melroformer.py bench $KIM $CKPT --threads $t --runs $RUNS 2>/dev/null | tee -a torch.txt
          done
          { echo "### PyTorch, one chunk (8 s)"; echo '```'; grep '^RESULT' torch.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-roformer-logs
          path: |
            bench.txt
            micro.txt
            torch.txt
            mr-parity.txt
            compare.txt
            torch-separate.txt
            rust-separate.txt
          if-no-files-found: ignore
